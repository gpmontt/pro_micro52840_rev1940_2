# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  # Default roles: left is central (USB/host side), right is peripheral.
  # ZMK Studio (RPC-over-USB) only needs to be built into whichever half is
  # central, since that's the half a USB-connected Studio session talks to.
  # BT_MAX_CONN/BT_MAX_PAIRED=4 on the central = 3 host profiles + 1 slot
  # for the peripheral half.
  - board: nice_nano_v2
    shield: corne_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_BT_MAX_CONN=4 -DCONFIG_BT_MAX_PAIRED=4
  - board: nice_nano_v2
    shield: corne_right
  - board: nice_nano_v2
    shield: settings_reset
  # Reversed roles: flash these instead of the defaults above if you want to
  # plug the RIGHT half into USB and have it be the host-connected half.
  - board: nice_nano_v2
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_left_peripheral
  - board: nice_nano_v2
    shield: corne_right
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y -DCONFIG_ZMK_STUDIO=y -DCONFIG_BT_MAX_CONN=4 -DCONFIG_BT_MAX_PAIRED=4
    artifact-name: corne_right_central
