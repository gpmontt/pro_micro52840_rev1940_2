# Corne RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Set a fixed underglow color per active layer (layer numbers match the
# #defines in corne.keymap); see rgb_layer_color/Kconfig for all options.
CONFIG_RGB_UNDERGLOW_LAYER_COLOR=y
# BASE: green
CONFIG_RGB_UNDERGLOW_LAYER_COLOR_L0_HUE=120
# COLEMAK: cyan
CONFIG_RGB_UNDERGLOW_LAYER_COLOR_L1_HUE=180
# LOWER: red
CONFIG_RGB_UNDERGLOW_LAYER_COLOR_L2_HUE=0
# RAISE: blue
CONFIG_RGB_UNDERGLOW_LAYER_COLOR_L3_HUE=240
# CONFIG: orange
CONFIG_RGB_UNDERGLOW_LAYER_COLOR_L4_HUE=30
CONFIG_RGB_UNDERGLOW_LAYER_COLOR_SAT=100

# Light a key LED for the active BT profile (white; solid when connected,
# blinking when not): BT0 = R, BT1 = F, BT2 = V (base layer).
# Values are LED chain indices; see README "Finding LED indices".
CONFIG_RGB_BT_PROFILE_INDICATOR_LED_0=10
CONFIG_RGB_BT_PROFILE_INDICATOR_LED_1=11
CONFIG_RGB_BT_PROFILE_INDICATOR_LED_2=12
# Stop blinking (back to the layer color) after this many seconds without a
# connection; 0 = blink forever.
CONFIG_RGB_BT_PROFILE_INDICATOR_BLINK_TIMEOUT_S=60

# Require passkey entry on the keyboard to authenticate BLE pairing.
# Without this, ZMK falls back to "Just Works" pairing, which has no
# protection against an active attacker relaying/MITM-ing the pairing
# handshake itself (LE Secure Connections, forced by ZMK's BT_SMP_SC_PAIR_ONLY,
# already blocks *passive* eavesdropping of pairing).
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# USB console logging (for debugging)
CONFIG_ZMK_USB_LOGGING=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y
