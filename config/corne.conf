# Corne RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Set a fixed underglow color while layer 2 (raise_layer) is active;
# see Kconfig at the repo root for the full option list.
CONFIG_RGB_UNDERGLOW_LAYER_COLOR=y
CONFIG_RGB_UNDERGLOW_LAYER_COLOR_LAYER=2
CONFIG_RGB_UNDERGLOW_LAYER_COLOR_HUE=130
CONFIG_RGB_UNDERGLOW_LAYER_COLOR_SAT=100
CONFIG_RGB_UNDERGLOW_LAYER_COLOR_BRT=100

# USB console logging (for debugging)
CONFIG_ZMK_USB_LOGGING=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y
