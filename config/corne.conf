# Corne RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Set a fixed underglow color per active layer (layer numbers match the
# #defines in corne.keymap); see rgb_layer_color/Kconfig for all options.
CONFIG_RGB_UNDERGLOW_LAYER_COLOR=y
# COLEMAK: orange
CONFIG_RGB_UNDERGLOW_LAYER_COLOR_L1_HUE=30
# LOWER: blue
CONFIG_RGB_UNDERGLOW_LAYER_COLOR_L2_HUE=240
# RAISE: green
CONFIG_RGB_UNDERGLOW_LAYER_COLOR_L3_HUE=130
CONFIG_RGB_UNDERGLOW_LAYER_COLOR_SAT=100
CONFIG_RGB_UNDERGLOW_LAYER_COLOR_BRT=100

# Require passkey entry on the keyboard to authenticate BLE pairing.
# Without this, ZMK falls back to "Just Works" pairing, which has no
# protection against an active attacker relaying/MITM-ing the pairing
# handshake itself (LE Secure Connections, forced by ZMK's BT_SMP_SC_PAIR_ONLY,
# already blocks *passive* eavesdropping of pairing).
CONFIG_ZMK_BLE_PASSKEY_ENTRY=y

# USB console logging (for debugging)
CONFIG_ZMK_USB_LOGGING=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y
